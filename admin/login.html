<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Pro Trading Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0d4f4f;
      --primary-dark: #083535;
      --accent: #00c9a7;
      --bg: #f5f7fa;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top right, rgba(0, 201, 167, 0.15), transparent 35%), var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .admin-login {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 18px 45px rgba(17, 24, 39, 0.08);
      padding: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 120px;
      height: auto;
      display: block;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.3;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .title {
      margin: 4px 0 6px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.86rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 79, 79, 0.12);
    }

    .btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #126c6c);
      color: #fff;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:hover { filter: brightness(1.03); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }

    .msg {
      margin-top: 10px;
      font-size: 0.85rem;
      min-height: 18px;
    }

    .msg.error { color: var(--danger); }
    .msg.ok { color: #0f766e; }

    .link {
      margin-top: 16px;
      text-align: center;
      font-size: 0.85rem;
    }

    .link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="admin-login">
    <div class="brand">
      <img class="brand-logo" src="../assets/logo-pro-trading-academy-usa.svg" alt="Pro Trading Academy">
      <div>
        <h1>Pro Trading Academy USA</h1>
        <p>Panel de Administración</p>
      </div>
    </div>

    <h2 class="title">Acceso de administradores</h2>
    <p class="subtitle">Este acceso es solo para gestionar cursos, clases y materiales.</p>

    <form id="adminLoginForm">
      <div class="field">
        <label for="adminEmail">Correo</label>
        <input id="adminEmail" type="email" required placeholder="admin@email.com">
      </div>
      <div class="field">
        <label for="adminPassword">Contraseña</label>
        <input id="adminPassword" type="password" required placeholder="••••••••">
      </div>
      <button id="adminLoginBtn" class="btn" type="submit">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar al panel
      </button>
      <div id="adminLoginMsg" class="msg"></div>
    </form>

    <div class="link">
      <a href="../login.html">Volver al login de estudiantes</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/branding-logo.js?v=20260525b"></script>
  <script>
    (function() {
      const form = document.getElementById("adminLoginForm");
      const emailInput = document.getElementById("adminEmail");
      const passwordInput = document.getElementById("adminPassword");
      const button = document.getElementById("adminLoginBtn");
      const message = document.getElementById("adminLoginMsg");

      function setMessage(text, type) {
        message.textContent = text || "";
        message.className = "msg" + (type ? " " + type : "");
      }

      form.addEventListener("submit", async function(event) {
        event.preventDefault();
        setMessage("");

        const supabase = window.getSupabaseClient ? window.getSupabaseClient() : null;
        if (!supabase) {
          setMessage("No se pudo inicializar Supabase.", "error");
          return;
        }

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const original = button.innerHTML;
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando...';

        try {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;

          const userId = data && data.user ? data.user.id : null;
          if (!userId) throw new Error("No se recibió usuario autenticado.");

          const { data: profile, error: profileError } = await supabase
            .from("profiles")
            .select("role")
            .eq("id", userId)
            .maybeSingle();

          if (profileError) throw profileError;

          if (!profile || profile.role !== "admin") {
            await supabase.auth.signOut();
            throw new Error("Tu usuario no tiene rol admin en la tabla profiles.");
          }

          setMessage("Acceso concedido. Redirigiendo...", "ok");
          window.location.href = "index.html";
        } catch (err) {
          setMessage(err && err.message ? err.message : "No se pudo iniciar sesión.", "error");
        } finally {
          button.disabled = false;
          button.innerHTML = original;
        }
      });
    })();
  </script>
</body>
</html>
