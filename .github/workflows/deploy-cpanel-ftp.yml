# Despliega el sitio en cPanel (protradingacademyusa.com) vía FTPS explícito, puerto 21.
#
# Valores para los Repository secrets en GitHub:
#   CPANEL_FTP_HOST      = ftp.ditecno.cl
#   CPANEL_FTP_USERNAME  = admin@protradingacademyusa.com
#   CPANEL_FTP_PASSWORD  = (contraseña de la cuenta FTP en cPanel)
#   CPANEL_FTP_PORT      = 21
#   CPANEL_REMOTE_DIR    = ./  (o public_html/ si aplica)

name: Desplegar a cPanel (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizar archivos por FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Subir sitio a cPanel por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT }}
          protocol: ftps
          server-dir: ${{ secrets.CPANEL_REMOTE_DIR }}
          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/node_modules/**
            README.md
            .DS_Store
