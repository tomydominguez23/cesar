<!DOCTYPE html>
<html lang="es" class="student-guard-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d4f4f">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Curso - Pro Trading Academy USA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css?v=20260703a">
</head>
<body class="portal-page course-page">

  <nav class="dash-navbar">
    <div class="container-lg dash-navbar-inner">
      <div class="dash-navbar-main">
        <a href="index.html" class="navbar-brand">
          <img class="brand-logo" src="assets/logo-pro-trading-academy-usa.svg" alt="Pro Trading Academy USA">
        </a>
        <div class="dash-nav-links">
          <a href="dashboard.html" class="active"><i class="fas fa-th-large"></i> Mis programas</a>
          <a href="calendar.html"><i class="fas fa-calendar-alt"></i> Calendario eventos</a>
          <a href="faq.html"><i class="fas fa-question-circle"></i> FAQ</a>
        </div>
      </div>
      <div class="dash-user">
        <div class="dash-user-meta">
          <div class="dash-user-name">Estudiante</div>
        </div>
        <div class="dash-user-avatar">ES</div>
      </div>
    </div>
  </nav>

  <div class="course-breadcrumb">
    <div class="container-lg">
      <nav class="course-breadcrumb-nav" aria-label="Ruta del curso">
        <a href="dashboard.html">Mis programas</a>
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
        <span id="courseBreadcrumbTitle">Curso</span>
      </nav>
    </div>
  </div>

  <main class="course-page-main">
    <div class="container-lg">
      <h1 id="coursePageTitle" class="course-page-title">Curso</h1>
      <div class="course-layout">
        <div class="course-main-col">
          <div class="video-wrapper course-video">
            <div id="courseLessonPlayer" class="video-placeholder"></div>
          </div>

          <section class="course-card course-lesson-card">
            <h2 id="courseLessonTitle" class="course-lesson-title">Clase</h2>
            <div class="course-lesson-tags">
              <span class="tag"><i class="fas fa-clock"></i> <span id="courseLessonDuration">—</span></span>
              <span class="tag"><i class="fas fa-play-circle"></i> Video</span>
            </div>
            <p id="courseLessonDescription" class="course-lesson-description">Selecciona una clase del panel derecho.</p>
            <h4 class="course-notes-label">Notas</h4>
            <p id="courseLessonNotes" class="course-lesson-notes">Sin notas.</p>
            <div class="course-next-wrap">
              <a href="#" id="courseNextLessonBtn" class="btn btn-primary btn-sm course-next-btn" style="display:none;"></a>
            </div>
          </section>

          <section class="course-card course-materials-card">
            <h3 class="course-materials-title"><i class="fas fa-download"></i> Material de Apoyo</h3>
            <div id="courseLessonMaterials" class="course-materials-list">
              <div class="text-small text-muted">Selecciona una clase para ver materiales.</div>
            </div>
          </section>
        </div>

        <aside class="course-sidebar">
          <div class="sidebar-header">
            <h4 id="courseSidebarTitle">Curso</h4>
            <span id="courseSidebarCount" class="lesson-count">0 clases</span>
          </div>
          <div id="courseLessonList" class="lesson-list"></div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="portal-footer">
    <div class="container">
      <p>&copy; 2026 Pro Trading Academy USA. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/student-guard.js"></script>
  <script src="js/branding-logo.js?v=20260525b"></script>
  <script src="js/student-content.js?v=20260702b"></script>
  <script src="js/mobile-portal-nav.js?v=20260702b"></script>
</body>
</html>
