<!DOCTYPE html>
<html lang="es" class="student-guard-pending">

<body class="portal-page" style="background: var(--gray-100);">

          <a href="calendar.html"><i class="fas fa-calendar-alt"></i> Calendario eventos</a>

        </div>
      </div>
      <div class="dash-user">
        <div style="text-align:right;">
          <div id="dashboardStudentName" style="font-size:0.85rem; font-weight:600;">Estudiante</div>

        <div class="dash-user-avatar">ES</div>
      </div>
    </div>

  <div class="dash-header">

      <div class="dash-header-content">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">

              <div id="dashboardStatCourses" style="font-size:1.8rem; font-weight:800; color:var(--secondary);">0</div>
              <div style="font-size:0.8rem; color:rgba(255,255,255,0.7);">Cursos publicados</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main style="padding: 32px 0 80px;">
    <div class="container-lg">
      <h3 style="margin-bottom:24px; font-size:1.5rem;">
        <i class="fas fa-th-large" style="color:var(--primary); margin-right:8px;"></i> Mis programas

      <p style="color: rgba(255,255,255,0.5); font-size: 0.85rem;">&copy; 2026 Pro Trading Academy USA. Todos los derechos reservados.</p>

  <script src="js/branding-logo.js?v=20260525b"></script>
