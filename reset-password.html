<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d4f4f">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Recuperar Contrasena - Pro Trading Academy USA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css?v=20260703c">
</head>
<body>

  <div class="login-page login-page-single">
    <div class="login-form-side" style="flex:1;">
      <div class="login-form-wrapper animate-fade-in-up">
        <div style="text-align:center; margin-bottom:24px;">
          <a href="index.html" class="navbar-brand" style="justify-content:center;">
            <img class="brand-logo login-brand-logo" src="assets/logo-pro-trading-academy-usa.svg" alt="Pro Trading Academy USA">
          </a>
        </div>

        <div id="requestPanel">
          <h3>Recuperar contrasena</h3>
          <p class="subtitle">Te enviaremos un enlace para restablecer tu contrasena.</p>
          <form id="resetRequestForm" onsubmit="handleResetRequest(event)">
            <div class="form-group">
              <label for="email">Correo electronico</label>
              <input type="email" id="email" class="form-control" placeholder="tu@email.com" required autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
              <i class="fas fa-paper-plane"></i> Enviar enlace
            </button>
          </form>
        </div>

        <div id="updatePanel" style="display:none;">
          <h3>Nueva contrasena</h3>
          <p class="subtitle">Elige una contrasena segura para tu cuenta.</p>
          <form id="updatePasswordForm" onsubmit="handleUpdatePassword(event)">
            <div class="form-group">
              <label for="newPassword">Nueva contrasena</label>
              <input type="password" id="newPassword" class="form-control" placeholder="Minimo 6 caracteres" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
              <label for="confirmNewPassword">Confirmar contrasena</label>
              <input type="password" id="confirmNewPassword" class="form-control" placeholder="Repite la contrasena" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
              <i class="fas fa-key"></i> Guardar contrasena
            </button>
          </form>
        </div>

        <div id="successMessage" class="auth-banner auth-banner-success" style="display:none; margin-top:16px;"></div>

        <p style="text-align:center; margin-top:24px; color:var(--gray-500); font-size:0.9rem;">
          <a href="login.html" style="color:var(--primary); font-weight:600;"><i class="fas fa-arrow-left"></i> Volver al inicio de sesion</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    const resetRedirectUrl = window.location.origin + window.location.pathname;

    function isRecoveryMode() {
      const hash = window.location.hash || "";
      const params = new URLSearchParams(window.location.search);
      return hash.includes("type=recovery") || params.get("type") === "recovery";
    }

    (function initPanels() {
      if (isRecoveryMode()) {
        document.getElementById("requestPanel").style.display = "none";
        document.getElementById("updatePanel").style.display = "block";
      }
    })();

    async function handleResetRequest(e) {
      e.preventDefault();
      const supabase = window.getSupabaseClient ? window.getSupabaseClient() : null;
      if (!supabase) {
        alert("No se pudo conectar. Intenta de nuevo.");
        return;
      }

      const email = document.getElementById("email").value.trim();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const original = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: resetRedirectUrl
        });
        if (error) throw error;

        const msg = document.getElementById("successMessage");
        msg.innerHTML = '<i class="fas fa-check-circle"></i> Revisa tu bandeja de entrada. Si no lo ves, revisa spam.';
        msg.style.display = "block";
        e.target.style.display = "none";
      } catch (err) {
        alert((err && err.message) ? err.message : "No se pudo enviar el enlace.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = original;
      }
    }

    async function handleUpdatePassword(e) {
      e.preventDefault();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmNewPassword").value;
      if (newPassword !== confirmPassword) {
        alert("Las contrasenas no coinciden.");
        return;
      }

      const supabase = window.getSupabaseClient ? window.getSupabaseClient() : null;
      if (!supabase) {
        alert("No se pudo conectar. Intenta de nuevo.");
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      const original = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

      try {
        const { error } = await supabase.auth.updateUser({ password: newPassword });
        if (error) throw error;

        alert("Contrasena actualizada correctamente.");
        window.location.href = "login.html";
      } catch (err) {
        alert((err && err.message) ? err.message : "No se pudo actualizar la contrasena. Solicita un nuevo enlace.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = original;
      }
    }
  </script>
</body>
</html>
